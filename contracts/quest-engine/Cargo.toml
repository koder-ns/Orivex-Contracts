[package]
name = "quest-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["contract"]
contract = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }
stake-vault = { path = "../stake-vault", default-features = false }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
